<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honey Money Pizza Cafe</title><link rel="stylesheet" href="style.css"></head><body><header><b>🍕 Honey Money Pizza Cafe</b><button id="cartBtn">🛒 Cart <span id="count">0</span></button></header><section class="hero"><h1>Order your favourite pizza 🍕</h1><p>Fresh • Hot • Fast</p></section><main><h2>Menu</h2><div id="menu">Loading menu…</div></main><div id="cart" class="panel"><h2>Your Cart <button onclick="closeCart()">✕</button></h2><div id="items"></div><h3>Total: ₹<span id="total">0</span></h3><button onclick="checkout()">Proceed to Order</button></div><div id="form" class="panel"><h2>Delivery Details</h2><input id="name" placeholder="Your name"><input id="phone" placeholder="Mobile number"><textarea id="address" placeholder="Full delivery address"></textarea><button onclick="placeOrder()">Place Order</button><p id="msg"></p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
